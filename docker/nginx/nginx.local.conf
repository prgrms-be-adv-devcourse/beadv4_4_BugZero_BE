server {
    listen 80;
    server_name localhost rarego-nginx;

    # DNS Resolver (Docker Internal DNS)
    resolver 127.0.0.11 valid=30s;

    # Auth Service
    location ~ ^/(api/v1/auth|oauth2|login/oauth2) {
        set $auth_up auth-service:8089;
        proxy_pass http://$auth_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auction Service (Specific Member activities)
    location ~ ^/api/v1/members/me/(bids|sales|orders|bookmarks) {
        set $auc_up auction-service:8083;
        proxy_pass http://$auc_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auction Service
    location /api/v1/auctions {
        set $auc_up auction-service:8083;
        proxy_pass http://$auc_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Bid Stream)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Payment Service
    location /api/v1/payments {
        set $pay_up payment-service:8082;
        proxy_pass http://$pay_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product Service
    location /api/v1/products {
        set $prod_up product-service:8084;
        proxy_pass http://$prod_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Member Service (General)
    location /api/v1/members {
        set $mem_up member-service:8081;
        proxy_pass http://$mem_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Internal APIs (서비스 간 내부 통신 전용) ==========
    location /api/v1/internal/members {
        set $mem_up member-service:8081;
        proxy_pass http://$mem_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/internal/auctions {
        set $auc_up auction-service:8083;
        proxy_pass http://$auc_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/internal/payments {
        set $pay_up payment-service:8082;
        proxy_pass http://$pay_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/internal/auth {
        set $auth_up auth-service:8089;
        proxy_pass http://$auth_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger / API Docs
    location ~ ^/(api-docs|swagger-ui|v3/api-docs) {
        set $auth_up auth-service:8089;
        proxy_pass http://$auth_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Grafana
    location /grafana/ {
        set $graf_up grafana:3000;
        proxy_pass http://$graf_up;
        proxy_set_header Host $host;
    }

    # Prometheus
    location /prometheus/ {
        set $prom_up prometheus:9090;
        proxy_pass http://$prom_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

