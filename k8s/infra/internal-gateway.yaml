apiVersion: v1
kind: ConfigMap
metadata:
  name: rarego-nginx-config
  namespace: rarego
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        server {
            listen 80;
            resolver kube-dns.kube-system.svc.cluster.local valid=30s;

            # Auth Service
            location ~ ^/(api/v1/internal/auth|api/v1/auth|oauth2|login/oauth2) {
                proxy_pass http://auth-service.rarego.svc.cluster.local:8089;
                proxy_set_header Host $host;
            }
            # Member Service
            location ~ ^/(api/v1/internal/members|api/v1/members) {
                proxy_pass http://member-service.rarego.svc.cluster.local:8081;
                proxy_set_header Host $host;
            }
            # Auction Service
            location ~ ^/(api/v1/internal/auctions|api/v1/auctions) {
                proxy_pass http://auction-service.rarego.svc.cluster.local:8083;
                proxy_set_header Host $host;
            }
            # Product Service
            location /api/v1/products {
                proxy_pass http://product-service.rarego.svc.cluster.local:8084;
                proxy_set_header Host $host;
            }
            # Payment Service
            location ~ ^/(api/v1/internal/payments|api/v1/payments) {
                proxy_pass http://payment-service.rarego.svc.cluster.local:8082;
                proxy_set_header Host $host;
            }
            # Notification Service
            location /api/v1/notifications {
                proxy_pass http://notification-service.rarego.svc.cluster.local:8085;
                proxy_set_header Host $host;
            }

            # Unknown route should fail fast
            location / {
                return 404;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: rarego-nginx
  namespace: rarego
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: rarego-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rarego-nginx
  namespace: rarego
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rarego-nginx
  template:
    metadata:
      labels:
        app: rarego-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: rarego-nginx-config
