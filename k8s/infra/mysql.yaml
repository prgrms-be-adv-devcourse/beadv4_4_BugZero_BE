apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: rarego
spec:
  serviceName: "mysql"
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.4.5
        ports:
        - containerPort: 3306
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: global-secret
              key: DB_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: "rarego"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        args:
        - "--character-set-server=utf8mb4"
        - "--collation-server=utf8mb4_unicode_ci"
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        - name: mysql-init-scripts
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mysql-init-scripts
        configMap:
          name: mysql-init-config
  volumeClaimTemplates:
  - metadata:
      name: mysql-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: rarego
spec:
  selector:
    app: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config
  namespace: rarego
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS rarego_auth;
    CREATE DATABASE IF NOT EXISTS rarego_member;
    CREATE DATABASE IF NOT EXISTS rarego_auction;
    CREATE DATABASE IF NOT EXISTS rarego_product;
    CREATE DATABASE IF NOT EXISTS rarego_payment;
    CREATE DATABASE IF NOT EXISTS rarego_notification;
