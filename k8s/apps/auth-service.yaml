apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rarego
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: rarego-auth-service:latest
        ports:
        - containerPort: 8089
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8089
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8089
          initialDelaySeconds: 90
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8089
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        env:
        - name: JAVA_OPTS
          value: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxRAM=256m"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/rarego_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: google-id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: google-secret
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: kakao-id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: naver-id
        - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth-secret
              key: naver-secret
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: SPRING_PROFILES_ACTIVE
        - name: FRONT_URL
          valueFrom:
            secretKeyRef:
              name: global-secret
              key: FRONT_URL
        - name: INTERNAL_BACK_URL
          value: "http://rarego-nginx"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rarego
spec:
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 8089
    targetPort: 8089
