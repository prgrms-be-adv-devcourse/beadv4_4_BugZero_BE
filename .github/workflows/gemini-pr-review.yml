name: Gemini PR Review

on:
  pull_request:
    branches: [ "dev", "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# 같은 PR에서 커밋이 연속으로 올라오면 이전 리뷰 실행은 취소하고 최신만 남김
concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini_review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      MAX_CHANGED_FILES: "40"
      MAX_CHANGED_LINES: "1200"
      GEMINI_COMMENT_MARKER: "<!-- GEMINI_REVIEW_COMMENT -->"

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Fetch base ref
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - name: Compute change size (skip if too large / docs-only)
        id: size
        shell: bash
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          HEAD="HEAD"

          CHANGED_FILES=$(git diff --name-only "$BASE...$HEAD" | wc -l | tr -d ' ')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

          # 라인 변경량: numstat(add,del) 합산. binary(-)는 0으로 처리
          CHANGED_LINES=$(git diff --numstat "$BASE...$HEAD" \
            | awk '{a=$1; d=$2; if(a=="-") a=0; if(d=="-") d=0; sum+=a+d} END{print sum+0}')
          echo "changed_lines=$CHANGED_LINES" >> $GITHUB_OUTPUT

          # docs-only 여부
          CHANGED=$(git diff --name-only "$BASE...$HEAD")
          if echo "$CHANGED" | grep -qE '^(README\.md|docs/|.*\.md$)' && \
             ! echo "$CHANGED" | grep -qvE '^(README\.md|docs/|.*\.md$)'; then
            echo "docs_only=true" >> $GITHUB_OUTPUT
          else
            echo "docs_only=false" >> $GITHUB_OUTPUT
          fi

          # too large 여부
          if [ "$CHANGED_FILES" -gt "${MAX_CHANGED_FILES}" ] || [ "$CHANGED_LINES" -gt "${MAX_CHANGED_LINES}" ]; then
            echo "too_large=true" >> $GITHUB_OUTPUT
          else
            echo "too_large=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare skip comment body (docs-only)
        if: steps.size.outputs.docs_only == 'true'
        run: |
          cat > gemini-comment.md <<'EOF'
          ## 🤖 Gemini Review (skipped)
          <!-- GEMINI_REVIEW_COMMENT -->

          Docs-only PR이라 리뷰를 생략했어요.
          EOF

      - name: Prepare skip comment body (too large)
        if: steps.size.outputs.docs_only != 'true' && steps.size.outputs.too_large == 'true'
        run: |
          FILES="${{ steps.size.outputs.changed_files }}"
          LINES="${{ steps.size.outputs.changed_lines }}"
          cat > gemini-comment.md <<EOF
          ## 🤖 Gemini Review (skipped)
          <!-- GEMINI_REVIEW_COMMENT -->

          변경량이 커서 자동 리뷰를 생략했어요.
          - changed files: ${FILES}
          - changed lines: ${LINES}

          (PR을 쪼개거나 수동 리뷰를 진행해 주세요.)
          EOF

      # Gemini 실행: docs-only 아니고 too-large도 아닐 때만
      - name: Run Gemini review (API Call)
        if: steps.size.outputs.docs_only != 'true' && steps.size.outputs.too_large != 'true'
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          DIFF=$(git diff "$BASE...HEAD")
          PROMPT=$(cat .github/gemini/prompts/review.md)
          
          # JSON payload 생성 (diff 포함)
          PAYLOAD=$(jq -n --arg system "$PROMPT" --arg code "$DIFF" \
            '{contents: [{parts: [{text: ($system + "\n\nCode Diff:\n" + $code)}]}]}')
          
          # API 호출 (Gemini 2.5 Flash 사용)
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > gemini-response.json
          
          # 결과 추출 및 저장
          if jq -e '.candidates[0].content.parts[0].text' gemini-response.json > /dev/null; then
            jq -r '.candidates[0].content.parts[0].text' gemini-response.json > gemini-review.md
          else
            echo "Gemini API Error or Empty Response"
            echo "Response: $(cat gemini-response.json)"
            echo "리뷰를 생성하는 중에 문제가 발생했습니다." > gemini-review.md
          fi

      - name: Prepare review comment body
        if: steps.size.outputs.docs_only != 'true' && steps.size.outputs.too_large != 'true'
        run: |
          cat > gemini-comment.md <<'EOF'
          ## 🤖 Gemini Review
          <!-- GEMINI_REVIEW_COMMENT -->
          EOF
          echo "" >> gemini-comment.md
          cat gemini-review.md >> gemini-comment.md

      # 댓글은 "생성"이 아니라 "업데이트 우선"
      - name: Upsert Gemini comment on PR (update if exists)
        if: always() && (steps.size.outputs.docs_only == 'true' || steps.size.outputs.too_large == 'true' || (steps.size.outputs.docs_only != 'true' && steps.size.outputs.too_large != 'true'))
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = process.env.GEMINI_COMMENT_MARKER;
            const body = fs.readFileSync('gemini-comment.md', 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body,
              });
            }
        env:
          GEMINI_COMMENT_MARKER: ${{ env.GEMINI_COMMENT_MARKER }}
