name: CI/CD

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      payment: ${{ steps.filter.outputs.payment }}
      member: ${{ steps.filter.outputs.member }}
      notification: ${{ steps.filter.outputs.notification }}
      auction: ${{ steps.filter.outputs.auction }}
      product: ${{ steps.filter.outputs.product }}
      auth: ${{ steps.filter.outputs.auth }}
      common: ${{ steps.filter.outputs.common }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            payment:
              - 'payment-service/**'
            member:
              - 'member-service/**'
            notification:
              - 'notification-service/**'
            auction:
              - 'auction-service/**'
            product:
              - 'product-service/**'
            auth:
              - 'auth-service/**'
            common:
              - 'common/**'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - '.github/workflows/cicd.yml'
            k8s:
              - 'k8s/**'

  build-test:
    needs: detect-changes
    strategy:
      matrix:
        include:
          - service: payment-service
            key: payment
          - service: member-service
            key: member
          - service: notification-service
            key: notification
          - service: auction-service
            key: auction
          - service: product-service
            key: product
          - service: auth-service
            key: auth
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3 # 9.2.3으로 일치
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          xpack.security.http.ssl.enabled: false
          xpack.security.transport.ssl.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        run: chmod +x ./gradlew

      - name: Test + Coverage verify (JaCoCo)
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        run: ./gradlew :${{ matrix.service }}:test :${{ matrix.service }}:jacocoTestReport :${{ matrix.service }}:jacocoTestCoverageVerification --stacktrace

      - name: Build with Gradle
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        run: ./gradlew :${{ matrix.service }}:build -x test

  build-images:
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-test ]
    permissions:
      contents: read
      packages: write
    if: |
      always() && 
      github.event_name == 'push' && 
      (needs.build-test.result == 'success' || needs.build-test.result == 'skipped')
    strategy:
      matrix:
        include:
          - name: payment-service
            dockerfile: payment-service/Dockerfile
            image_suffix: "-payment-service"
            key: payment
          - name: member-service
            dockerfile: member-service/Dockerfile
            image_suffix: "-member-service"
            key: member
          - name: notification-service
            dockerfile: notification-service/Dockerfile
            image_suffix: "-notification-service"
            key: notification
          - name: auction-service
            dockerfile: auction-service/Dockerfile
            image_suffix: "-auction-service"
            key: auction
          - name: product-service
            dockerfile: product-service/Dockerfile
            image_suffix: "-product-service"
            key: product
          - name: auth-service
            dockerfile: auth-service/Dockerfile
            image_suffix: "-auth-service"
            key: auth
          - name: product-elasticsearch
            dockerfile: docker/elasticsearch/Dockerfile
            image_suffix: "-product-elasticsearch"
            key: common # Infrastructure image depends on common/global changes
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: actions/checkout@v4

      - name: Set lowercase image name
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-test, build-images ]
    if: |
      always() && 
      (github.event_name == 'push') && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (needs.build-images.result == 'success' || (needs.detect-changes.outputs.k8s == 'true' && needs.build-test.result != 'failure'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Update K8S Image Tags
        run: |
          cd k8s
          IMAGE_TAG="sha-${{ env.SHORT_SHA }}"
          REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          
          if [ "${{ needs.detect-changes.outputs.auth }}" == "true" ] || [ "${{ needs.detect-changes.outputs.common }}" == "true" ]; then
            kustomize edit set image rarego-auth-service=ghcr.io/${REPO_NAME}-auth-service:${IMAGE_TAG}
          fi
          if [ "${{ needs.detect-changes.outputs.member }}" == "true" ] || [ "${{ needs.detect-changes.outputs.common }}" == "true" ]; then
            kustomize edit set image rarego-member-service=ghcr.io/${REPO_NAME}-member-service:${IMAGE_TAG}
          fi
          if [ "${{ needs.detect-changes.outputs.auction }}" == "true" ] || [ "${{ needs.detect-changes.outputs.common }}" == "true" ]; then
            kustomize edit set image rarego-auction-service=ghcr.io/${REPO_NAME}-auction-service:${IMAGE_TAG}
          fi
          if [ "${{ needs.detect-changes.outputs.product }}" == "true" ] || [ "${{ needs.detect-changes.outputs.common }}" == "true" ]; then
            kustomize edit set image rarego-product-service=ghcr.io/${REPO_NAME}-product-service:${IMAGE_TAG}
            kustomize edit set image rarego-product-elasticsearch=ghcr.io/${REPO_NAME}-product-elasticsearch:${IMAGE_TAG}
          fi
          if [ "${{ needs.detect-changes.outputs.payment }}" == "true" ] || [ "${{ needs.detect-changes.outputs.common }}" == "true" ]; then
            kustomize edit set image rarego-payment-service=ghcr.io/${REPO_NAME}-payment-service:${IMAGE_TAG}
          fi
          if [ "${{ needs.detect-changes.outputs.notification }}" == "true" ] || [ "${{ needs.detect-changes.outputs.common }}" == "true" ]; then
            kustomize edit set image rarego-notification-service=ghcr.io/${REPO_NAME}-notification-service:${IMAGE_TAG}
          fi

      - name: Create K8s secret file
        run: |
          # Generate htpasswd hash for Nginx basic auth
          export NGINX_BASIC_AUTH_HTPASSWD="${NGINX_BASIC_AUTH_USER}:$(openssl passwd -apr1 ${NGINX_BASIC_AUTH_PASS})"
          envsubst < k8s/secret.yaml.template > k8s/secret.yaml
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          KAKAO_CLIENT: ${{ secrets.KAKAO_CLIENT }}
          NAVER_CLIENT: ${{ secrets.NAVER_CLIENT }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TZ: ${{ secrets.TZ }}
          FRONT_URL: ${{ secrets.FRONT_URL }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          TOSS_PAYMENTS_SECRET_KEY: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          ELASTICSEARCH_URIS: ${{ secrets.ELASTICSEARCH_URIS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GF_SERVER_ROOT_URL: ${{ secrets.GF_SERVER_ROOT_URL }}
          GF_SERVER_SERVE_FROM_SUB_PATH: ${{ secrets.GF_SERVER_SERVE_FROM_SUB_PATH }}
          NGINX_BASIC_AUTH_USER: ${{ secrets.NGINX_BASIC_AUTH_USER }}
          NGINX_BASIC_AUTH_PASS: ${{ secrets.NGINX_BASIC_AUTH_PASS }}


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get EC2 Instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=team3-server" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Deploy to K8S via SSM
        run: |
          K8S_FILES_BASE64=$(tar -czf - -C k8s . | base64 -w 0)

          aws ssm send-command \
            --instance-ids ${{ steps.get-instance.outputs.instance_id }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"mkdir -p /tmp/k8s\",
              \"echo '$K8S_FILES_BASE64' | base64 -d | tar -xzf - -C /tmp/k8s\",
              \"kubectl --kubeconfig /etc/kubernetes/admin.conf apply -k /tmp/k8s/\",
              \"kubectl --kubeconfig /etc/kubernetes/admin.conf -n rarego create secret docker-registry ghcr-creds --docker-server=ghcr.io --docker-username='${{ secrets.GHCR_USERNAME }}' --docker-password='${{ secrets.GHCR_TOKEN }}' --dry-run=client -o yaml | kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -\",
              \"kubectl --kubeconfig /etc/kubernetes/admin.conf patch serviceaccount default -n rarego -p '{\\\"imagePullSecrets\\\":[{\\\"name\\\":\\\"ghcr-creds\\\"}]}'\",
              \"kubectl --kubeconfig /etc/kubernetes/admin.conf rollout restart deployment -n rarego\",
              \"kubectl --kubeconfig /etc/kubernetes/admin.conf rollout restart statefulset -n rarego\",
              \"kubectl --kubeconfig /etc/kubernetes/admin.conf -n rarego rollout status statefulset/mysql --timeout=300s\",
              \"kubectl --kubeconfig /etc/kubernetes/admin.conf -n rarego exec mysql-0 -- mysql -uroot -p'${{ secrets.DB_ROOT_PASSWORD }}' -e \\\"CREATE USER IF NOT EXISTS '${{ secrets.DB_USERNAME }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}'; ALTER USER '${{ secrets.DB_USERNAME }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}'; GRANT ALL PRIVILEGES ON *.* TO '${{ secrets.DB_USERNAME }}'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;\\\"\",
              \"rm -rf /tmp/k8s\"
            ]" \
            --output text

      - name: Clean up local secrets
        if: always()
        run: rm -f k8s/secret.yaml
