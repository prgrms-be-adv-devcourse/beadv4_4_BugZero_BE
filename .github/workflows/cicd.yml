name: CI/CD

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  packages: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      payment: ${{ steps.filter.outputs.payment }}
      member: ${{ steps.filter.outputs.member }}
      notification: ${{ steps.filter.outputs.notification }}
      auction: ${{ steps.filter.outputs.auction }}
      product: ${{ steps.filter.outputs.product }}
      auth: ${{ steps.filter.outputs.auth }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            payment:
              - 'payment-service/**'
            member:
              - 'member-service/**'
            notification:
              - 'notification-service/**'
            auction:
              - 'auction-service/**'
            product:
              - 'product-service/**'
            auth:
              - 'auth-service/**'
            common:
              - 'common/**'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - '.github/workflows/cicd.yml'

  build-test:
    needs: detect-changes
    strategy:
      matrix:
        include:
          - service: payment-service
            key: payment
          - service: member-service
            key: member
          - service: notification-service
            key: notification
          - service: auction-service
            key: auction
          - service: product-service
            key: product
          - service: auth-service
            key: auth
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3 # 9.2.3으로 일치
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          xpack.security.http.ssl.enabled: false
          xpack.security.transport.ssl.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10    
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        run: chmod +x ./gradlew

      - name: Test + Coverage verify (JaCoCo)
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        run: ./gradlew :${{ matrix.service }}:test :${{ matrix.service }}:jacocoTestReport :${{ matrix.service }}:jacocoTestCoverageVerification --stacktrace

      - name: Build with Gradle
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        run: ./gradlew :${{ matrix.service }}:build -x test

  build-images:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test]
    if: |
      always() && 
      github.event_name == 'push' && 
      (needs.build-test.result == 'success' || needs.build-test.result == 'skipped')
    strategy:
      matrix:
        include:
          - name: payment-service
            dockerfile: payment-service/Dockerfile
            image_suffix: "-payment-service"
            key: payment
          - name: member-service
            dockerfile: member-service/Dockerfile
            image_suffix: "-member-service"
            key: member
          - name: notification-service
            dockerfile: notification-service/Dockerfile
            image_suffix: "-notification-service"
            key: notification
          - name: auction-service
            dockerfile: auction-service/Dockerfile
            image_suffix: "-auction-service"
            key: auction
          - name: product-service
            dockerfile: product-service/Dockerfile
            image_suffix: "-product-service"
            key: product
          - name: auth-service
            dockerfile: auth-service/Dockerfile
            image_suffix: "-auth-service"
            key: auth
          - name: product-elasticsearch
            dockerfile: docker/elasticsearch/Dockerfile
            image_suffix: "-product-elasticsearch"
            key: common # Infrastructure image depends on common/global changes
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: actions/checkout@v4

      - name: Set lowercase image name
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        id: image
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.common == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-test, build-images ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect infra changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'docker-compose.yml'
              - 'docker/**'

      - name: Copy docker-compose.yml to EC2
        if: steps.changes.outputs.infra == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,docker"
          target: "~/beadv4_4_BugZero_BE"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_INFRA: ${{ steps.changes.outputs.infra }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/beadv4_4_BugZero_BE
            cd ~/beadv4_4_BugZero_BE
            
            # .env.deploy 파일 초기화 및 환경 변수 주입
            echo "PAYMENT_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-payment-service:${{ github.ref_name }}" > .env.deploy
            echo "MEMBER_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-member-service:${{ github.ref_name }}" >> .env.deploy
            echo "NOTIFICATION_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-notification-service:${{ github.ref_name }}" >> .env.deploy
            echo "AUCTION_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-auction-service:${{ github.ref_name }}" >> .env.deploy
            echo "PRODUCT_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-product-service:${{ github.ref_name }}" >> .env.deploy
            echo "PRODUCT_ELASTICSEARCH_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-product-elasticsearch:${{ github.ref_name }}" >> .env.deploy
            echo "AUTH_DOCKER_IMAGE=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')-auth-service:${{ github.ref_name }}" >> .env.deploy
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.deploy
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env.deploy
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.deploy
            echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env.deploy
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env.deploy
            echo "TZ=${{ secrets.TZ }}" >> .env.deploy
            echo "TOSS_PAYMENTS_SECRET_KEY=${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}" >> .env.deploy
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.deploy
            echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" >> .env.deploy
            echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env.deploy
            echo "FRONT_URL=${{ secrets.FRONT_URL }}" >> .env.deploy
            echo "GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}" >> .env.deploy
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env.deploy
            echo "GF_SERVER_ROOT_URL=${{ secrets.GF_SERVER_ROOT_URL }}" >> .env.deploy
            echo "GF_SERVER_SERVE_FROM_SUB_PATH=${{ secrets.GF_SERVER_SERVE_FROM_SUB_PATH }}" >> .env.deploy
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env.deploy
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env.deploy
            echo "KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" >> .env.deploy
            echo "ELASTICSEARCH_URIS=${{ secrets.ELASTICSEARCH_URIS }}" >> .env.deploy
            echo "NGINX_BASIC_AUTH_USER=${{ secrets.NGINX_BASIC_AUTH_USER }}" >> .env.deploy
            echo "NGINX_BASIC_AUTH_PASS=${{ secrets.NGINX_BASIC_AUTH_PASS }}" >> .env.deploy
            
            # GitHub Secret에서 프로필 설정
            echo "SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}" >> .env.deploy
            
            # 소셜 로그인 키 추가
            echo "GOOGLE_CLIENT=${{ secrets.GOOGLE_CLIENT }}" >> .env.deploy
            echo "GOOGLE_SECRET=${{ secrets.GOOGLE_SECRET }}" >> .env.deploy
            echo "KAKAO_CLIENT=${{ secrets.KAKAO_CLIENT }}" >> .env.deploy
            echo "NAVER_CLIENT=${{ secrets.NAVER_CLIENT }}" >> .env.deploy
            echo "NAVER_SECRET=${{ secrets.NAVER_SECRET }}" >> .env.deploy

            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            
            # 모든 서비스 이미지 pull
            docker compose --env-file .env.deploy pull
            
            # 서비스 시작 (nginx 제외)
            docker compose --env-file .env.deploy up -d
            
            # 서비스들이 시작될 시간 대기
            echo "Waiting for services to start..."
            sleep 15
            
            # nginx 강제 재시작 (새 서비스 컨테이너에 연결)
            docker compose --env-file .env.deploy restart nginx
            
            docker image prune -f
